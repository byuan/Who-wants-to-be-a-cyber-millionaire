<!DOCTYPE html>
<html>
<head>
    <title>Cyber Millionaire Login</title>
    <style>
    body {
        margin: 0;
        background: black;
        color: white;
        font-family: Arial, Helvetica, sans-serif;

        display: flex;
        justify-content: center;
        align-items: center;

        height: 100vh;
    }

    .login-box {
        text-align: center;
        width: 350px;
    }

    h1 {
        margin-bottom: 10px;
    }

    p {
        margin-bottom: 30px;
        color: #cccccc;
    }

    /* Username and password fields */
    input[type="text"],
    input[type="password"] {
        width: 100%;
        padding: 12px;
        box-sizing: border-box;
        margin-bottom: 15px;

        background: #222;
        color: white;

        border: 1px solid #666;
        border-radius: 5px;

        font-size: 16px;
        outline: none;
    }

    /* Highlight the field currently being typed in */
    input[type="text"]:focus,
    input[type="password"]:focus {
        border-color: #2b7cff;
        box-shadow: 0 0 5px rgba(43, 124, 255, 0.4);
    }

    /* Login button */
    input[type="submit"] {
        width: 100%;
        padding: 12px;

        background: #2b7cff;
        color: white;

        border: none;
        border-radius: 5px;

        font-size: 16px;
        cursor: pointer;

        margin-top: 5px;
    }

    input[type="submit"]:hover {
        background: #1d5fc9;
    }
</style>
</head>
<body>

<div class="login-box">

    <h1>Welcome to Cyber Millionaire</h1>
    <p>
        Login to play Cyber Millionaire.
    </p>
    <form method="post" action="/login/">
        {% csrf_token %}

        <input
            type="text"
            name="username"
            placeholder="Username"
            required>

        <input
            type="password"
            name="password"
            placeholder="Password"
            required>

        <input
            type="submit"
            value="Login">
    </form>

</div>

</body>
</html>
