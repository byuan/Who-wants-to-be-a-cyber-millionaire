<!DOCTYPE html>
<html>
<head>
    <title>Select Topics</title>
    {% load static %}
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>

<body>

    <div class="topic-container">

        <h1>Select Question Topics</h1>

        {% if error %}
            <div class="error-box">
                {{ error }}
            </div>
        {% endif %}

        <form action="{% url 'save_topics' %}" method="post">

            {% csrf_token %}
            
            <div class="topic-grid">


                {% for group in groups %}
                <div class="topic-column">
                    <h2>{{ group.label }}</h2>
                    {% for topic in all_topics %}
                    <label>
                        <input type="checkbox"
                               name="{{ group.key }}_topics"
                               value="{{ topic }}"
                               {% if topic in group.selected %}checked{% endif %}>
                        {{ topic }}
                    </label>
                    {% endfor %}
                </div>
                {% endfor %}

            </div>
                
            <div class="topic-buttons">
                <input type="submit" value="Save Topics">
                <a href="/">Cancel</a>
            </div>

        </form>

        {% if request.session.is_admin %}

        <hr>

        <div class="topic-buttons">

            <form action="{% url 'add_topic' %}" method="post">

                {% csrf_token %}

                <input 
                    type="text" 
                    name="new_topic"
                    maxlength="100"
                    placeholder="Enter new topic"
                >

                <input type="submit" value="Add Topic">

            </form>

        </div>
        {% endif %}

    </div>

</body>
</html>
