{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Select Topics</title>
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>

<body>

<div class="container">

        <h1>Select Question Topics</h1>

        <form action="/save-topics/" method="post">
            {% csrf_token %}

            <h2>Primary School</h2>

            <label><input type="checkbox" name="easy_topics" value="Passwords"> Passwords</label><br>
            <label><input type="checkbox" name="easy_topics" value="Internet Safety"> Internet Safety</label><br>

            <label><input type="checkbox" name="easy_topics" value="Hacking"> Hacking</label><br>
            <label><input type="checkbox" name="easy_topics" value="Digital Footprints"> Digital Footprints</label><br>

            <label><input type="checkbox" name="medium_topics" value="Network Security"> Network Security</label><br>
            <label><input type="checkbox" name="medium_topics" value="Endpoint Security"> Endpoint Security</label><br>
            <label><input type="checkbox" name="medium_topics" value="Advanced Persistent Threats"> Advanced Persistent Threats</label>

            <h2>College</h2>

            <label><input type="checkbox" name="hard_topics" value="Intrusion Detection Systems"> Intrusion Detection Systems</label><br>
            <label><input type="checkbox" name="hard_topics" value="Cyber Threat Intelligence"> Cyber Threat Intelligence</label><br>
            <label><input type="checkbox" name="hard_topics" value="Digital Forensics"> Digital Forensics</label><br>

            <label><input type="checkbox" name="hard_topics" value="Network Encryption"> Network Encryption</label>
