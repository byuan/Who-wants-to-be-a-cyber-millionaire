<!DOCTYPE html>
<html>
<head>
    <title>Players</title>
    <link href="/css/style.css" rel="stylesheet">
    <link rel="icon" href="/img/tigerlogo.jpg">
</head>

<body>
    <div class="players-container">
        <h1>Players</h1>
        <h3>Performance over time, per player. The trend shows accuracy for each game played.</h3>

        <div id="empty" class="players-empty" style="display: none;">
            No games have been played yet.
        </div>

        <div id="players"></div>

        <div class="topic-buttons">
            <a href="/">Back to Home</a>
        </div>
    </div>

    <script>
        const SVG = 'http://www.w3.org/2000/svg';
        const CHART = { width: 280, height: 56, pad: 6 };

        // Accuracy-over-games sparkline. Single series per player, so identity
        // comes from the row header (no legend); y is fixed at 0-100 so trends
        // are comparable across players; the last value is direct-labeled and
        // each game has an enlarged hover target with a tooltip.
        function sparkline(games) {
            const svg = document.createElementNS(SVG, 'svg');
            svg.setAttribute('width', CHART.width);
            svg.setAttribute('height', CHART.height);
            svg.setAttribute('role', 'img');
            svg.setAttribute('aria-label', 'Accuracy per game: ' + games.map(g => g.accuracy + '%').join(', '));

            const innerW = CHART.width - CHART.pad * 2 - 34; // room for the end label
            const innerH = CHART.height - CHART.pad * 2;
            const x = (i) => CHART.pad + (games.length === 1 ? innerW / 2 : (i / (games.length - 1)) * innerW);
            const y = (accuracy) => CHART.pad + innerH - (accuracy / 100) * innerH;

            // Recessive 50% reference line
            const mid = document.createElementNS(SVG, 'line');
            mid.setAttribute('x1', CHART.pad);
            mid.setAttribute('x2', CHART.pad + innerW);
            mid.setAttribute('y1', y(50));
            mid.setAttribute('y2', y(50));
            mid.setAttribute('class', 'spark-grid');
            svg.appendChild(mid);

            if (games.length > 1) {
                const line = document.createElementNS(SVG, 'polyline');
                line.setAttribute('points', games.map((g, i) => x(i) + ',' + y(g.accuracy)).join(' '));
                line.setAttribute('class', 'spark-line');
                svg.appendChild(line);
            }

            games.forEach((g, i) => {
                const dot = document.createElementNS(SVG, 'circle');
                dot.setAttribute('cx', x(i));
                dot.setAttribute('cy', y(g.accuracy));
                dot.setAttribute('r', i === games.length - 1 ? 3.5 : 2.5);
                dot.setAttribute('class', 'spark-dot');
                svg.appendChild(dot);

                // Hover target larger than the mark, with a native tooltip
                const hit = document.createElementNS(SVG, 'circle');
                hit.setAttribute('cx', x(i));
                hit.setAttribute('cy', y(g.accuracy));
                hit.setAttribute('r', 9);
                hit.setAttribute('class', 'spark-hit');
                const tip = document.createElementNS(SVG, 'title');
                tip.textContent = 'Game ' + (i + 1) + ' - ' + g.accuracy + '% ('
                    + g.correct + '/' + g.questions + ')'
                    + (g.won ? ' - won' : '') + '\n' + new Date(g.played_at).toLocaleString();
                hit.appendChild(tip);
                svg.appendChild(hit);
            });

            // Direct label on the latest value only
            const last = games[games.length - 1];
            const label = document.createElementNS(SVG, 'text');
            label.setAttribute('x', x(games.length - 1) + 8);
            label.setAttribute('y', Math.min(Math.max(y(last.accuracy) + 4, 12), CHART.height - 4));
            label.setAttribute('class', 'spark-label');
            label.textContent = last.accuracy + '%';
            svg.appendChild(label);

            return svg;
        }

        function gameTable(games) {
            const details = document.createElement('details');
            const summary = document.createElement('summary');
            summary.textContent = 'Game history';
            details.appendChild(summary);

            const table = document.createElement('table');
            table.className = 'players-table';
            table.innerHTML = '<tr><th>#</th><th>When</th><th>Type</th><th>Mode</th><th>Score</th><th>Result</th></tr>';
            games.forEach((g, i) => {
                const row = table.insertRow();
                const type = String(g.selection || '').indexOf('dynamic') === 0 ? 'Dynamic' : 'Static';
                const cells = [
                    i + 1,
                    new Date(g.played_at).toLocaleString(),
                    type,
                    g.mode || '-',
                    g.accuracy + '% (' + g.correct + '/' + g.questions + ')',
                    g.won ? 'Won' : 'Lost'
                ];
                for (const value of cells) row.insertCell().textContent = value;
            });
            details.appendChild(table);
            return details;
        }

        fetch('/api/stats')
            .then(r => r.json())
            .then(players => {
                if (players.length === 0) {
                    document.getElementById('empty').style.display = 'block';
                    return;
                }
                const root = document.getElementById('players');
                for (const p of players) {
                    const card = document.createElement('div');
                    card.className = 'player-card';

                    const header = document.createElement('div');
                    header.className = 'player-header';
                    header.innerHTML =
                        '<span class="player-name"></span>' +
                        '<span class="player-meta">' + p.gamesPlayed + ' game' + (p.gamesPlayed === 1 ? '' : 's')
                        + ' | ' + p.wins + ' won | ' + p.accuracy + '% overall'
                        + ' | last played ' + new Date(p.lastPlayed).toLocaleDateString() + '</span>';
                    header.querySelector('.player-name').textContent = p.player;
                    card.appendChild(header);

                    const body = document.createElement('div');
                    body.className = 'player-body';
                    body.appendChild(sparkline(p.games));

                    const feedback = document.createElement('a');
                    feedback.className = 'player-feedback';
                    feedback.href = '/feedback?player=' + encodeURIComponent(p.player);
                    feedback.textContent = 'AI Feedback';
                    body.appendChild(feedback);
                    card.appendChild(body);

                    card.appendChild(gameTable(p.games));
                    root.appendChild(card);
                }
            })
            .catch(() => {
                const empty = document.getElementById('empty');
                empty.textContent = 'Failed to load player stats.';
                empty.style.display = 'block';
            });
    </script>
</body>
</html>
